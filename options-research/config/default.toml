# options-research default configuration (M1, fixtures only).
# Nothing in this file enables live data, model spend, email or trading.

[project]
id = "options-research"
environment = "offline-fixtures"

[model]
enabled = false                 # AnthropicModelClient refuses to construct while false
provider = "anthropic"
specialist_model = "claude-sonnet-5-5"
cheap_model = "claude-haiku-5-5"
max_calls_per_request = 8
max_tokens_per_request = 60000

[defaults]
news_window_days = 7            # disclosed in every briefing when applied
timezone = "UTC"

[ledger]
dir = "data"                    # relative to options-research/, git-ignored, append-only JSONL

[delivery]
inline_only = true              # email delivery rejected at intake in M1

[tradier]
base_url = "https://sandbox.tradier.com/v1"   # sandbox: delayed data, no live account
token_env = "TRADIER_SANDBOX_TOKEN"            # read from the environment at call time; never stored
max_quote_age_s = 900                          # quotes older than this vs as_of are flagged stale
wide_spread_ratio = 0.25                       # spread/mid above this is flagged wide

[edgar]
user_agent = ""                                # REQUIRED by SEC fair-access policy: "name email"; set before use
max_rps = 10

[news]
provider = "finnhub"                           # Finnhub company-news (header auth). Marketaux refused: query-param token.
base_url = "https://finnhub.io/api/v1/company-news"
key_env = "FINNHUB_API_KEY"                    # read from the environment at call time; never stored
allow_backfill = false                         # backfilled history is hidden from as-of research unless disclosed
live_since = ""                                # ISO instant when continuous polling began; empty = everything is backfill

[risk]
max_chain_age_s = 3600                         # chain older than this at review time -> BLOCK; also bounds verdict expiry
account_limits_configured = false              # false -> every risk review is at least REVIEW; no sizing
iv_premium_review_points = 10                  # ATM IV minus realised forecast at/above this (vol points) -> REVIEW reason

[pricing]
risk_free_rate = 0.04                          # FIXTURE placeholder until a rate source is configured
fees_per_contract = 0.65                       # FIXTURE; Robinhood charges 0 commission, exchange/regulatory fees vary
spot_steps_pct = [-20, -15, -10, -5, 0, 5, 10, 15, 20]
iv_shifts_rel = [-0.30, 0.0, 0.30]
otm_pct = 0.05                                 # short-leg distance from spot for spreads (first usable strike beyond)
